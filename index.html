<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Storefront Mockup</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone-store">

    <div class="header-row">
        <div class="brand" id="brand"></div>
        <div class="cart" id="cart"></div>
    </div>

    <div id="completionBanner" class="completion-banner"></div>

    <div class="image-container">
        <img id="productImage" alt="Product">
    </div>

    <h1 id="productTitle"></h1>

    <div class="subtitle" id="subtitle"></div>

    <div class="price" id="price"></div>

    <div id="statusBox"></div>

    <div id="versionGrid"></div>

    <button class="details-btn">
        ▼ View Product Details & Info
    </button>

    <button id="ctaButton"></button>

    <div class="footer-note" id="footerNote"></div>

</div>

<div id="toast" class="toast">
    Added to Cart
</div>

<script src="script.js"></script>

</body>
</html>
